# .github/workflows/build-muflowrt.yml
name: Build MuFlowRT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  phreeqcrm:
    name: Build PhreeqcRM
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out dependency build helpers
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /.gitattributes
            /.github/actions/setup-msys2/
            /.github/DEPENDENCIES.md
            /scripts/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-msys2
        with:
          extra-packages: mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build PhreeqcRM from the pinned GitHub release
        run: |
          set -euo pipefail
          bash scripts/build-phreeqcrm.sh 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/phreeqcrm-build.log"
      - name: Archive the installed PhreeqcRM SDK
        id: package
        run: |
          set -euo pipefail
          bash scripts/package-dependency.sh phreeqcrm 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/phreeqcrm-package.log"
      - name: Retain PhreeqcRM SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/dependency-dist/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Collect PhreeqcRM build diagnostics
        if: always()
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          diagnostics="$temp/phreeqcrm-build-diagnostics"
          files=(
            "$temp"/phreeqcrm-*.log
            "$temp"/dependency-*.txt
            /c/phreeqcrm/build/CMakeFiles/CMakeConfigureLog.yaml
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "$diagnostics"
              cp -- "$file" "$diagnostics/"
            fi
          done
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phreeqcrm-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phreeqcrm-build-diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  openfoam:
    name: Build OpenFOAM libraries
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name || steps.cached-package.outputs.artifact-name }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out dependency build helpers
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /.gitattributes
            /.github/actions/setup-msys2/
            /.github/DEPENDENCIES.md
            /scripts/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-msys2
        with:
          extra-packages: flex bison
      - name: Fingerprint the OpenFOAM toolchain
        id: openfoam-cache-key
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          read -r toolchain_hash _ < <(sha256sum "$temp/dependency-toolchain.txt")
          echo "toolchain-hash=$toolchain_hash" >> "$GITHUB_OUTPUT"
      - name: Restore cached OpenFOAM SDK
        id: openfoam-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/openfoam-sdk-cache
          key: >-
            openfoam-sdk-v1-${{ runner.os }}-${{ steps.openfoam-cache-key.outputs.toolchain-hash }}-${{ hashFiles('.github/workflows/build-muflowrt.yml', 'scripts/build-openfoam.sh', 'scripts/package-dependency.sh', '.github/actions/setup-msys2/action.yml', '.github/DEPENDENCIES.md') }}
      - name: Build OpenFOAM from the pinned source commits
        if: steps.openfoam-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/build-openfoam.sh 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/openfoam-build.log"
      - name: Archive the built OpenFOAM trees
        id: package
        if: steps.openfoam-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/package-dependency.sh openfoam 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/openfoam-package.log"
      - name: Verify cached OpenFOAM SDK
        id: cached-package
        if: steps.openfoam-sdk-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          cached="$temp/openfoam-sdk-cache"
          (cd "$cached" && sha256sum --check --strict SHA256SUMS)
          if ! cmp -s "$cached/TOOLCHAIN_ABI.txt" "$temp/dependency-abi.txt"; then
            echo "::error::Cached OpenFOAM SDK compiler/runtime versions differ from this runner. Clear the OpenFOAM SDK cache and rebuild."
            cat "$cached/TOOLCHAIN_ABI.txt" "$temp/dependency-abi.txt"
            exit 1
          fi
          echo "artifact-name=deps-openfoam-13-ucrt64-x86_64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Prepare OpenFOAM SDK cache
        if: success() && steps.openfoam-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/openfoam-sdk-cache"
          cp -a "$temp/dependency-dist/." "$temp/openfoam-sdk-cache/"
      - name: Save OpenFOAM SDK cache
        if: success() && steps.openfoam-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/openfoam-sdk-cache
          key: ${{ steps.openfoam-sdk-cache.outputs.cache-primary-key }}
      - name: Retain OpenFOAM SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name || steps.cached-package.outputs.artifact-name }}
          path: ${{ runner.temp }}/openfoam-sdk-cache/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openfoam-*.log
            ${{ runner.temp }}/dependency-*.txt
          retention-days: 14
          if-no-files-found: ignore

  muflowrt:
    name: Build and publish muFlowRT
    needs: [phreeqcrm, openfoam]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-msys2
        with:
          extra-packages: zip
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.phreeqcrm.outputs.artifact-name }}
          path: ${{ runner.temp }}/sdk-phreeqcrm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.openfoam.outputs.artifact-name }}
          path: ${{ runner.temp }}/sdk-openfoam
      - name: Verify and restore dependency SDKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          temp=$(cygpath -u "$RUNNER_TEMP")
          for dependency in phreeqcrm openfoam; do
            sdk="$temp/sdk-$dependency"
            (cd "$sdk" && sha256sum --check --strict SHA256SUMS)
            if ! cmp -s "$sdk/TOOLCHAIN_ABI.txt" "$temp/dependency-abi.txt"; then
              echo "::error::$dependency compiler/runtime versions differ from this runner. Rerun all jobs together to refresh the toolchains."
              cat "$sdk/TOOLCHAIN_ABI.txt" "$temp/dependency-abi.txt"
              exit 1
            fi
          done
          extract_sdk() {
            local directory=$1 name=$2 destination=$3
            local files=("$directory/$name.tar.zst")
            if [[ ! -f ${files[0]} ]]; then
              files=("$directory/$name.tar.zst.part-"*)
            fi
            if (( ${#files[@]} == 0 )); then
              echo "Missing SDK archive: $directory/$name" >&2
              return 1
            fi
            mkdir -p "$destination"
            cat "${files[@]}" | zstd -dc | tar -xf - -C "$destination"
          }
          extract_sdk "$temp/sdk-phreeqcrm" phreeqcrm-3.8.6-17100-ucrt64-x86_64 /c/phreeqcrm
          extract_sdk "$temp/sdk-openfoam" openfoam-13-ucrt64-x86_64 /c
      - name: Build muFlowRT using the restored SDKs
        run: |
          set -euo pipefail
          bash scripts/build-muflowrt.sh 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/muflowrt-build.log"
      - name: Assemble runtime bundle and release assets
        id: package
        run: |
          set -euo pipefail
          bash scripts/package-muflowrt.sh 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/muflowrt-package.log"
      - name: Retain release assets for publication retries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/muflowrt-dist/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish unsigned runtime and SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-dependency.sh "$RELEASE_TAG" "$RUNNER_TEMP/muflowrt-dist"
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muflowrt-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/muflowrt-*.log
            ${{ runner.temp }}/dependency-*.txt
          retention-days: 14
          if-no-files-found: ignore
